<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉路径实验对照</title><style>body{background:#111315;color:#eee;font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;margin:30px auto;max-width:1350px;padding:0 24px}h1{font-size:28px}p{color:#aaa}select,button{background:#24292d;color:#eee;padding:10px;border:1px solid #444;margin:8px}.pair{border-top:1px solid #333;padding:18px 0}h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:10px;overflow:auto;margin:14px 0;align-items:center}.label{width:80px;flex-shrink:0;font-size:11px;color:#aaa}figure{margin:0;width:105px;flex-shrink:0}img{width:105px;height:105px;object-fit:contain}figcaption{font-size:10px;color:#aaa}section{margin-top:35px}.empty{color:#bbaaa1}</style><h1>同一批头像，三种视觉连接</h1><p>实验对照页。路线来自相同端点与建图规则；图片之间的连接仍待人工评价。公开演示页不提供模型切换。</p><label>模式<select id="mode"><option value="routes">16组固定端点路线</option><option value="neighbors">近邻对照</option></select></label><select id="anchor"></select><div id="stats"></div><main id="out"></main><script src="comparison-data.js"></script><script>
let catalog,byId;const el=id=>document.getElementById(id);function image(id){const s=byId.get(id),f=document.createElement('figure'),im=document.createElement('img');im.src='../'+s.avatar;im.alt=s.name;const c=document.createElement('figcaption');c.textContent='#'+id;f.append(im,c);return f}function row(method,ids){const r=document.createElement('div');r.className='row';const label=document.createElement('span');label.className='label';label.textContent=method;r.append(label);if(!ids.length){const p=document.createElement('span');p.className='empty';p.textContent='没有可用路径';r.append(p)}else ids.forEach(id=>r.append(image(id)));return r}
function render(){el('out').replaceChildren();if(el('mode').value==='neighbors'){const id=el('anchor').value,index=catalog.styles.findIndex(s=>s.id===id);for(const m of COMPARISON.methods)el('out').append(row(m.method,[id,...COMPARISON.neighbors[m.method][index]]));return}COMPARISON.methods[0].routes.forEach((r,i)=>{if(el('pair').value!==''&&el('pair').value!==String(i))return;const section=document.createElement('section');section.className='pair';const h=document.createElement('h2');h.textContent=r.from+' → '+r.to;section.append(h);for(const m of COMPARISON.methods)section.append(row(m.method,m.routes[i].ids));el('out').append(section)})}
const pair=document.createElement('select');pair.id='pair';pair.setAttribute('aria-label','选择对照路线');const all=document.createElement('option');all.value='';all.textContent='全部16组';pair.append(all);COMPARISON.methods[0].routes.forEach((r,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=r.from+' → '+r.to;pair.append(o)});el('anchor').after(pair);pair.onchange=render;
fetch('../data/catalog.json').then(r=>r.json()).then(c=>{catalog=c;byId=new Map(c.styles.map(s=>[s.id,s]));for(const s of c.styles){const o=document.createElement('option');o.value=s.id;o.textContent='#'+s.id+' '+s.name;el('anchor').append(o)}el('stats').textContent=COMPARISON.methods.map(m=>m.method+': '+m.edges+'条连接 / '+m.reachableTestPairs+'/16组可达 / '+m.isolated.length+'个孤立节点').join(' · ');el('mode').onchange=render;el('anchor').onchange=render;render()});</script></html>
